<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMSATS Assignment Portal Demo</title>
<style>
body{font:16px Arial;background:#f3f6fb;color:#182235;margin:0}.wrap{max-width:850px;margin:50px auto;padding:20px}.card{background:white;padding:24px;border-radius:12px;box-shadow:0 5px 22px #152b4b12;margin:18px 0}
input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;border:1px solid #ccd5e2;border-radius:7px}button{padding:12px 20px;background:#2457a7;color:white;border:0;border-radius:7px;cursor:pointer}li{padding:9px;border-bottom:1px solid #eee}small{color:#63738a}
</style></head><body><div class="wrap">
    <h1>COMSATS Assignment Submission Portal</h1>
    <small>GitHub Pages static demonstration · CSC418</small>
    <section class="card"><h2>Submit assignment (demo)</h2>
    <p>This Pages version stores demo entries in this browser only. Use the Flask app for the full server-backed assignment.</p><form id="form"><input id="name" placeholder="Student name" required><input id="reg" placeholder="Registration number" required><input id="title" placeholder="Assignment title" required><input id="url" type="url" placeholder="https://submission-link" required><button>Save demo submission</button></form></section><section class="card"><h2>Saved in this browser</h2><ul id="list"></ul></section></div><script>
const key='csc418-demo-submissions';const form=document.querySelector('#form'),list=document.querySelector('#list');function draw(){const rows=JSON.parse(localStorage.getItem(key)||'[]');list.innerHTML='';rows.forEach(x=>{const li=document.createElement('li');li.textContent=`${x.name} · ${x.reg} · ${x.title} · ${x.url}`;list.append(li)})}form.addEventListener('submit',e=>{e.preventDefault();const x={name:name.value,reg:reg.value,title:title.value,url:url.value};if(!/^https?:\\/\\//i.test(x.url)){alert('Enter a valid HTTP(S) URL');return}const rows=JSON.parse(localStorage.getItem(key)||'[]');rows.push(x);localStorage.setItem(key,JSON.stringify(rows));form.reset();draw()});draw();
</script></body>
</html>
